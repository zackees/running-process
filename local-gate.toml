# Run from a clean committed tree with ci-lint pinned in ci/local_gate.py:
# uvx --from git+https://github.com/zackees/ci.yml@86b63937960d00655f7ef3752ef6f15b6b06f35b ci-lint local-gate run
# The helper replays the actual Linux quick workflow through published Bosn.
# No product tests run on the developer host; exact source and executed steps
# are required before the outer ci-lint command stamps an attestation.
[gate]
run = ["uv", "run", "--no-project", "--python", "3.11", "python", "ci/local_gate.py"]
verify = "ci.yml:ci-mode"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group and must
# run first, with no `needs:`.
verify-exempt = ["cancel-superseded"]
mode = "enforce"

[gate.lanes.linux-quick]
run = ["uv", "run", "--no-project", "--python", "3.11", "python", "ci/local_gate.py"]
tools = ["bosn", "docker"]
# No exclusions until input-reuse evidence proves them safe.

[gate.lanes.dylint]
run = ["uv", "run", "--no-project", "--python", "3.11", "python", "ci/dylint_gate.py"]
tools = ["soldr", "rustup"]
# Both repo-owned lint libraries run over the workspace. The platform-boundary
# lint is pre-expansion, so it inspects cfg-inactive OS branches from one host;
# the env-literal lint is a late lint and only sees the host module graph, so a
# cross-target pass for it is still outstanding (see ci/dylint_gate.py).
# A missing nightly skips with instructions instead of failing the gate, which
# matches ./lint; set RUNNING_PROCESS_REQUIRE_DYLINT=1 to make it a failure.

[gate.trust]
mode = "enforce"
skip = ["ci.yml:linux-quick"]
covered-by = { "ci.yml:linux-quick" = ["linux-quick"] }
surfaces = ["ci/**", "lints/**", ".config/nextest.toml", "Cargo.lock", "rust-toolchain.toml", "bosn.toml"]
full-labels = ["ci-full", "ci-integration"]
audit-rate = 10
