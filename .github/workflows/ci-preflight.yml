name: CI Preflight (Reusable)

# Consolidated per-platform preflight (#513 follow-up): ONE job per
# platform that builds the workspace + dev wheel exactly once, then
# runs lint → unit tests → integration tests → rustdoc sequentially
# against that single build.
#
# Previous shape was warm-then-fan-out: a warm job populated a shared
# target/ cache and 3-4 sub-worker jobs each restored it — but every
# sub-worker still re-ran uv sync + the maturin dev wheel build, and
# each job paid runner spin-up, checkout, toolchain install, and cache
# download/upload. Sequential steps in one job share the venv, target/,
# and wheel install directly: the build happens once per platform.
#
# Rust toolchain + build cache: zackees/setup-soldr (fleet rule
# CACHE-025, zackees/ci.yml#209). It provisions the toolchain from
# rust-toolchain.toml and restores/saves soldr's zccache-backed build
# cache. Cargo commands run as `soldr cargo ...` so they hit that cache;
# the Python CI stages route through soldr automatically once it is on
# the runner (ci/soldr.py:cargo_command).

# Why debug profile, not release: this workflow is for the dev-loop
# (every branch push + PR). Debug compiles are ~5x faster than
# release; the slight runtime cost is irrelevant for tests. Release
# wheel builds stay in auto-release.yml.

on:
  workflow_call:
    inputs:
      os:
        description: Runner label (e.g. ubuntu-24.04, macos-14, windows-latest).
        type: string
        required: true
      label:
        description: Human-readable platform label (e.g. linux-x86) used in job names + artifact suffixes.
        type: string
        required: true
      rustdoc:
        description: Run the rustdoc step. Default true on linux-x86 only; off elsewhere to limit runner cost.
        type: boolean
        default: false
      integration-test:
        description: Run the integration-test steps.
        type: boolean
        default: true
      dylint:
        description: Run both workspace Dylints (Linux x86 on every PR; macOS/Windows x86 on their opt-in tiers).
        type: boolean
        default: false
      cache-key-suffix:
        description: Stable cache family name for this lane.
        type: string
        default: shared

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: "always"
  # Link glibc binaries with a GNU build-id note, as ci-preflight-rust.yml
  # already does for musl. Since CACHE-025 soldr links these targets through
  # its managed clang + lld, which emits no build-id unless asked, and the
  # build-id tests (`current_executable_exposes_a_gnu_build_id`, the probe's
  # PT_NOTE module attribution) cannot find one. Target-scoped, so the
  # Windows and macOS lanes that share this workflow are unaffected.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-Wl,--build-id=sha1"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-Wl,--build-id=sha1"

jobs:
  preflight:
    name: preflight (${{ inputs.label }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "full"
      RUST_LIB_BACKTRACE: "full"
      # ci-tests forbids bulk target snapshots; keep the existing parallel
      # nextest execution rather than setup-soldr's conservative default.
      NEXTEST_TEST_THREADS: "num-cpus"
    steps:
      - uses: actions/checkout@v4
        name: Checkout candidate source

      - uses: actions/setup-python@v5
        name: Set up python
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        name: Set up uv
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: venv-${{ inputs.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ inputs.os }}-py3.11-

      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025). Remote saves remain main-only (#1216). Global
      # auto keeps compatible local compiler artifacts reusable under act2;
      # an explicit global false still disables every save (#1306).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          ci-tests: true
          save-cache: auto
          job-status: ${{ job.status }}
          save-cache-remote: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: ${{ inputs.label }}-${{ inputs.cache-key-suffix }}
          prebuild-deps: none
          # maturin runs `cargo` itself. The shims route it through soldr too,
          # so the wheel build shares the zccache-materialized (read-only)
          # artifacts the `soldr cargo` steps leave in target/ instead of
          # failing to overwrite them, and is cached like every other build.
          shims: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Sync venv (frozen, no project install)
        run: uv sync --frozen --group dev --no-install-project --python 3.11

      # #1216: save only on main; PR runs restore main's entry.
      - name: Save venv
        if: ${{ github.ref == 'refs/heads/main' && steps.venv-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      # THE build. Workspace + all targets + downstream features, debug
      # profile, exactly once. Everything below reuses this target/.
      #
      # running-process-py is excluded: pyo3's build scripts rerun when PATH or
      # VIRTUAL_ENV change, which `uv run` does, so later steps re-ran them and
      # rebuilt every pyo3 dependent made here (~30 s). nextest builds the
      # crate for its tests and maturin builds the wheel; neither could reuse
      # this copy.
      - name: cargo build (workspace + all-targets, debug, --features client)
        # The extra features mirror what running-process-py requests, so the
        # unified feature set matches nextest's full-workspace build and the
        # crates built here are reused instead of rebuilt.
        run: soldr cargo build --workspace --all-targets --exclude running-process-py --features client,running-process/async-process,running-process/originator-scan,running-process/probe,running-process/pty

      # ci.lint and ci.test import `running_process` at runtime, so the
      # dev wheel must be installed in the venv. Cargo compile replays
      # from the build above, so this is mostly maturin packaging cost —
      # and it happens once, not once per sub-worker.
      - name: Dev wheel build
        id: build
        run: uv run --no-sync --module ci.run_logged logs/dev-build.log -- uv run --no-sync --module ci.build_wheel --dev

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          RUNNING_PROCESS_LINT_COMMAND_TIMEOUT_SECONDS: "300"
        run: uv run --no-sync --module ci.run_logged logs/lint.log -- uv run --no-sync --module ci.lint

      - name: Record kernel substrate timing
        if: ${{ inputs.label == 'linux-x86' }}
        run: uv run --no-sync --module ci.kernel_substrate_timing --output logs/kernel-substrate-timing.json

      # This is deliberately a separate minimal-feature public API contract:
      # the workspace test pass uses its normal feature selection and would
      # otherwise not exercise the kernal-api substrate facade.  The stage
      # builds testbins first because the external test launches them.
      - name: Async semantic capture contract (kernel substrate)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/async-semantic-capture.log -- uv run --no-sync --module ci test-async-semantic-capture

      # Direct daemon identity keeps the caller's endpoint and payload wire;
      # run its no-default facade/mux goldens and real accepted-IPC probe on
      # every host rather than letting the broad client build mask a feature
      # or platform regression.
      - name: Direct backend identity contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/backend-identity.log -- uv run --no-sync --module ci test-backend-identity

      # The raw v1 Frame codec is independently useful to an existing daemon
      # that retains its own endpoint and payload. Exercise its no-default
      # feature graph and frozen byte tests on every target.
      - name: Frame v1 codec contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/frame-v1-codec.log -- uv run --no-sync --module ci test-frame-v1-codec

      # Persisted v1 registration uses only protobuf, SHA-256, host facts, and
      # owner-private files. Exercise its no-default bytes and filesystem
      # contract separately from the broker/client build on every target.
      - name: Daemon registration contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/daemon-registration.log -- uv run --no-sync --module ci test-daemon-registration

      # v2 service-definition persistence is a writer-only compatibility
      # substrate. Exercise it without client IPC/runtime features and also
      # verify the established v1/v2 extension coexistence on every host.
      - name: Daemon registration v2 writer contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/daemon-registration-v2.log -- uv run --no-sync --module ci test-daemon-registration-v2

      - name: Upload kernel substrate timing
        if: ${{ always() && inputs.label == 'linux-x86' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-substrate-timing-${{ inputs.label }}
          path: logs/kernel-substrate-timing.json
          if-no-files-found: warn

      - name: Terminal graphics capability matrix
        timeout-minutes: 10
        env:
          RUNNING_PROCESS_TERMINAL_CAPABILITY_EXPORT_DIR: ${{ github.workspace }}/logs/terminal-capabilities/${{ inputs.label }}
        run: |
          soldr cargo test -p running-process --test pty --features client terminal_graphics_capabilities_test:: -- --nocapture

      - name: Report terminal graphics capability matrix
        if: ${{ always() }}
        run: uv run --no-sync --module ci.terminal_capability_report ${{ github.workspace }}/logs/terminal-capabilities/${{ inputs.label }}

      - name: Unit Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/test.log -- uv run --no-sync --module ci.test

      - name: Broker Hello perf guard
        if: ${{ inputs.label == 'linux-x86' }}
        env:
          RUNNING_PROCESS_BROKER_HELLO_PERF_GUARD: "1"
        run: |
          soldr cargo test -p running-process --test broker --features client real_socket_hello_roundtrip_perf_gate -- --nocapture

      - name: Integration Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.integration-test }}
        env:
          RUNNING_PROCESS_LIVE_TESTS: "1"
          RUNNING_PROCESS_GH_PTY_TESTS: "1"
        run: uv run --no-sync --module ci.run_logged logs/integration-test.log -- uv run --no-sync --module ci.test --live-only -ra --strict-markers

      # Every binary, not just the one the next step needs.
      #
      # `bin/daemon.rs` compiles only when `running-process-daemon` is built,
      # and nothing here built it: the workspace build above uses `--features
      # client`, and this step named a single binary. So #760 moved a value
      # that `bin/daemon.rs` still borrowed and main stopped producing a
      # daemon binary — undetected until the 4.7.0 release tried, where it
      # failed all six standalone-binary targets at once.
      #
      # `--bins` closes that: cargo builds every binary whose required-features
      # are satisfied, so a binary cannot go unbuilt just because no step
      # happened to name it. Verified by restoring the #760 break, which fails
      # this step with the same E0382 the release hit.
      - name: Build all binaries (daemon feature)
        if: ${{ inputs.integration-test }}
        run: soldr cargo build -p running-process --features daemon --bins

      # ci.servicedef_proof refuses to run if the platform-default
      # service-definition directory already exists. The Integration
      # Tests step above may leave that directory behind on a clean
      # runner; clear it before the proof so the test starts cold.
      - name: Clear stale servicedef state
        if: ${{ inputs.integration-test }}
        shell: bash
        run: |
          rm -rf "$HOME/.config/running-process/services" \
                 "$HOME/Library/Application Support/running-process/services" || true
          if [ -n "${APPDATA:-}" ]; then
            rm -rf "$(printf '%s' "$APPDATA" | tr '\\' '/')/running-process/services" || true
          fi

      - name: Servicedef install-path proof
        if: ${{ inputs.integration-test }}
        env:
          RUNNING_PROCESS_LIVE_TESTS: "1"
        run: uv run --no-sync --module ci.run_logged logs/servicedef-proof.log -- uv run --no-sync --module ci.servicedef_proof

      - name: Upload servicedef proof evidence
        if: ${{ always() && inputs.integration-test }}
        uses: actions/upload-artifact@v4
        with:
          name: servicedef-proof-${{ inputs.label }}
          path: logs/servicedef-proof-*.json
          if-no-files-found: warn

      - name: Check Rust API docs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.rustdoc }}
        env:
          RUSTDOCFLAGS: "-Dwarnings"
        run: soldr cargo doc -p running-process --features daemon --no-deps

      - name: Display failure diagnostics
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          if ls logs/*.analytics.json >/dev/null 2>&1; then
            echo "::warning::Failure analytics detected"
            for f in logs/*.analytics.json; do
              [ -f "$f" ] && echo "--- $f ---" && cat "$f"
            done
          fi
          if [ -d logs/running-process ]; then
            echo "::warning::running-process diagnostics detected"
            for f in logs/running-process/*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.json)
                  echo "--- $f ---"
                  cat "$f"
                  ;;
                *.log)
                  echo "--- $f (tail -200) ---"
                  tail -n 200 "$f"
                  ;;
              esac
            done
          fi
          echo "::group::Rust toolchain diagnostics"
          command -v rustup >/dev/null 2>&1 && rustup show || true
          command -v rustc >/dev/null 2>&1 && rustc -Vv || true
          command -v cargo >/dev/null 2>&1 && cargo -V || true
          echo "::endgroup::"

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-preflight-${{ inputs.label }}
          path: logs/*
          if-no-files-found: warn

      - name: Upload terminal capability matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-capabilities-${{ inputs.label }}
          path: logs/terminal-capabilities/${{ inputs.label }}/*
          if-no-files-found: warn

  # Dylint runs in its own job, in parallel with preflight: it builds into its
  # own ephemeral target dir and a separate compiler-unit cache family.
  # Keep it off the preflight critical path without saving linked fixtures.
  dylint:
    name: dylint (${{ inputs.label }})
    if: ${{ inputs.dylint }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      SOLDR_DYLINT_DRIVER_FALLBACK: "off"
      # The lint crates select dylint-link through cfg(all()). Soldr's
      # automatic linker only detects exact-triple Cargo config entries;
      # keep the declared linker so it emits Dylint's qualified library name.
      SOLDR_LINKER: "default"
    # Keep fixture and managed-tool commands consistent across existing lanes.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        name: Checkout candidate source

      - name: Set up managed Dylint tools and compiler cache
        uses: zackees/setup-soldr@v0
        env:
          SOLDR_DYLINT_DRIVER_FALLBACK: "off"
        with:
          version: "0.9.29"
          cache: true
          ci-tests: true
          job-status: ${{ job.status }}
          save-cache: auto
          save-cache-remote: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: dylint-${{ inputs.label }}
          # Dylint embeds template.tar from its registry source; the current
          # registry payload omits that asset. Keep compiler-unit reuse only.
          cargo-registry-cache: false
          prebuild-deps: none
          dylint: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: "6.0.3"
          dylint-link-version: "6.0.3"
          dylint-output-cache: false

      # The fixture tests and `cargo dylint` build the same dependencies, but
      # cargo-dylint links with `dylint-link`, and the linker is part of cargo's
      # fingerprint. Sharing one target dir made each side rebuild ~80 crates
      # every run (the saved cache held only the gate's state). The fixtures
      # get their own ephemeral subdirectory; linked fixtures are never cached.
      - name: Dylint negative fixture
        if: ${{ inputs.dylint }}
        working-directory: lints/running-process-env-literal
        env:
          CARGO_BIN: cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/running-process-dylint-target/fixtures
        run: soldr cargo +nightly-2026-05-28 test --locked

      - name: Dylint platform-boundary fixture
        if: ${{ inputs.dylint }}
        # Run from the lint crate so its .cargo/config.toml (linker =
        # dylint-link) applies, exactly as the negative fixture's does. With
        # --manifest-path from the repo root the default linker was used; the
        # linker is in cargo's fingerprint, so the two fixtures rebuilt ~99
        # shared crates every run.
        working-directory: lints/running-process-platform-boundary
        env:
          CARGO_BIN: cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/running-process-dylint-target/fixtures
        run: soldr cargo +nightly-2026-05-28 test --locked

      - name: Dylint workspace gate
        if: ${{ inputs.dylint }}
        env:
          CARGO_BIN: cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/running-process-dylint-target
        run: |
          soldr dylint --all --workspace
          soldr dylint --all --path lints --pattern running-process-platform-boundary --workspace


  # One required check for the lint lanes. `dylint` is skipped when a caller
  # does not request it, which is fine; but if it was requested it must have
  # run and passed, and a failed or cancelled preflight must never read green
  # just because a sibling job was skipped.
  lint-gates:
    name: lint gates (${{ inputs.label }})
    if: ${{ always() }}
    needs: [preflight, dylint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require preflight and requested Dylint to have passed
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DYLINT: ${{ needs.dylint.result }}
          DYLINT_REQUESTED: ${{ inputs.dylint }}
        run: |
          echo "preflight=$PREFLIGHT dylint=$DYLINT requested=$DYLINT_REQUESTED"
          [ "$PREFLIGHT" = success ] || exit 1
          if [ "$DYLINT_REQUESTED" = true ]; then
            [ "$DYLINT" = success ] || exit 1
          fi
