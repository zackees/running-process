name: CI Preflight (macOS)

# Thin dispatcher — calls ci-preflight.yml twice, once per macOS arch.
# Supersedes preflight-macos.yml (PR #510 precedent); the older file
# is left in place for the soak period per #513 acceptance criteria
# and removed in a follow-up PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ci-macos-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86:
    # Platform-fix PRs run only their selected native workflow. Keep the
    # workflow itself subscribed so skipped jobs remain visible to GitHub.
    if: ${{ github.event_name != 'pull_request' || !(github.head_ref == 'fix/linux' || startsWith(github.head_ref, 'fix/linux/') || github.head_ref == 'fix/win' || startsWith(github.head_ref, 'fix/win/')) }}
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: macos-15-intel
      label: macos-x86
      rustdoc: false
      integration-test: true

  arm:
    if: ${{ github.event_name != 'pull_request' || !(github.head_ref == 'fix/linux' || startsWith(github.head_ref, 'fix/linux/') || github.head_ref == 'fix/win' || startsWith(github.head_ref, 'fix/win/')) }}
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: macos-14
      label: macos-arm
      rustdoc: false
      integration-test: true
