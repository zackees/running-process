name: Linux x86 Build

# Manual wheel-collection entry point only (ci/publish.py fallback).
# Push/PR builds are covered by the consolidated CI Preflight
# workflows (ci-linux/ci-macos/ci-windows -> ci-preflight.yml),
# and release wheels by auto-release.yml.
on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: "Build mode"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - release

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  call:
    uses: ./.github/workflows/_build.yml
    with:
      runs-on: ubuntu-24.04
      artifact-name: wheels-linux-x86
      build-mode: ${{ inputs.build-mode || 'dev' }}
      include-sdist: true
      include-crates: true

  # Spot-check for the RUNNING_PROCESS_REPRODUCIBLE=1 seam (#392):
  # build the debug `runpm` binary twice (cleaning only the workspace
  # crate in between) and require byte-identical SHA256 digests.
  # See docs/reproducible-builds.md for the full recipe.
  reproducible-spot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025, zackees/ci.yml#209). Saves are main-only (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: ubuntu-24.04-reproducible
          prebuild-deps: none

      - name: Double-build runpm and compare SHA256
        run: uv run --no-project --module ci.reproducible --verify
