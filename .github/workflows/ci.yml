name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run the full platform, feature, and coverage suite.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A label event runs only the lanes that label adds (see each job's `if:`), in
# its own group, so it no longer cancels and restarts the push run for the same
# SHA. Before this, 82 of 115 cancelled PR runs in a week (2026-09-25..10-02)
# were a ci-mac/ci-windows/ci-full label restarting an identical quick run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Read the exact PR head and the base's trust policy. Covered quick checks
  # reuse a verified local proof; audit samples retain remote execution.
  ci-mode:
    name: CI mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      # Either proof may skip the quick lane: a source-bound attestation on a
      # PR (GATE-008/010), or a verified byte-identical merge on main
      # (GEN-021). Both are fail-closed, and neither is set unless its own
      # check ran and passed.
      skip_linux-quick: ${{ steps.gate.outputs.skip_linux-quick || steps.reuse.outputs.skip_linux-quick }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zackees/ci.yml
          ref: ef98004c3ac1c246428f1498f741b44eb9e65b25
          path: .ci-lint
          sparse-checkout: ci_lint
          persist-credentials: false
      - name: Local gate attestation
        id: gate
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output

      # zackees/ci.yml#162 (GEN-021): a push to `main` whose one merged PR
      # already validated a byte-identical tree may skip the quick lane.
      # Asserts nothing unless exactly one PR is merged into main with
      # `merge_commit_sha` equal to the pushed SHA, the trees are equal, and
      # the proving `preflight` leg is `success` and fresh. A squash-merge
      # batch or a drifted tree leaves the lane running.
      #
      # The daily `schedule` full matrix (linux-full, macos, windows,
      # coverage, all-features) is the drift backstop and refreshes the
      # caches this lane would otherwise rewrite, so no nightly is added.
      - name: Verified default-branch reuse
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=.ci-lint python3 -m ci_lint reuse-check
          --workflow ci.yml --mode enforce --github-output
          --max-age-hours 24
          --required-job 'Linux x64 checks / preflight (linux-x86)'

  linux-quick:
    needs: [ci-mode]
    name: Linux x64 checks
    if: ${{ needs.ci-mode.outputs.skip_linux-quick != 'true' && (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full) && !(github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || !((github.event.action != 'labeled' || github.event.label.name == 'ci-integration') && github.event.action != 'unlabeled'))) ) }}
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: ubuntu-24.04
      label: linux-x86
      rustdoc: false
      integration-test: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-integration') }}
      dylint: true

  linux-full:
    needs: [ci-mode]
    name: Linux full matrix
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') && (github.event.action != 'labeled' || github.event.label.name == 'ci-full') && github.event.action != 'unlabeled') }}
    uses: ./.github/workflows/ci-linux.yml

  macos:
    needs: [ci-mode]
    name: macOS tests
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-mac') || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (github.event.action != 'labeled' || github.event.label.name == 'ci-mac' || github.event.label.name == 'ci-full') && github.event.action != 'unlabeled') }}
    uses: ./.github/workflows/ci-macos.yml

  windows:
    needs: [ci-mode]
    name: Windows tests
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-windows') || contains(github.event.pull_request.labels.*.name, 'ci-full')) && (github.event.action != 'labeled' || github.event.label.name == 'ci-windows' || github.event.label.name == 'ci-full') && github.event.action != 'unlabeled') }}
    uses: ./.github/workflows/ci-windows.yml

  coverage:
    needs: [ci-mode]
    name: Linux coverage
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') && (github.event.action != 'labeled' || github.event.label.name == 'ci-full') && github.event.action != 'unlabeled') }}
    uses: ./.github/workflows/coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  all-features:
    needs: [ci-mode]
    name: Windows and macOS all-features tests
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') && (github.event.action != 'labeled' || github.event.label.name == 'ci-full') && github.event.action != 'unlabeled') }}
    uses: ./.github/workflows/ci-all-features.yml

  cache-budget:
    name: Cache budget maintenance
    needs: [linux-full, macos, windows, coverage, all-features]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/cache-budget.yml
