name: Security audit

on:
  pull_request:
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Read the exact PR head and the base's trust policy. Shadow mode reports
  # proof without skipping remote coverage until a real pilot is validated.
  ci-mode:
    name: CI mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      skip_linux-quick: ${{ steps.gate.outputs.skip_linux-quick }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zackees/ci.yml
          ref: 86b63937960d00655f7ef3752ef6f15b6b06f35b
          path: .ci-lint
          sparse-checkout: ci_lint
          persist-credentials: false
      - name: Local gate attestation
        id: gate
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output

  cargo-audit:
    needs: [ci-mode]
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025, zackees/ci.yml#209). Saves are main-only (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: ubuntu-24.04-security-audit
          prebuild-deps: none

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: soldr cargo audit --deny warnings
