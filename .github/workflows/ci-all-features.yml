name: All-Features Tests (Windows/macOS)

# Closes the gap #1083 describes: every test behind `daemon`, `probe`,
# `client-async`, `telemetry` and friends is compiled by exactly one lane
# (Linux coverage, which is `--all-features`), so a platform-specific
# assertion inside one of them is exercised on the platform it was not
# written for, or on none at all. #1081 was that bug: a Windows arm that
# had been wrong since #1042 because nothing ever ran it.
#
# Invoked by ci.yml on the nightly and full-suite paths. Ordinary pull
# requests stay on the Linux x64 quick checks.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: "always"

jobs:
  all-features:
    name: all-features (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One host's failure is not evidence about the other, and finding out
      # both are red in one run beats finding out twice.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86
          - os: macos-15-intel
            label: macos-x86
          - os: macos-14
            label: macos-arm
    env:
      RUST_BACKTRACE: "full"
      RUST_LIB_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: venv-${{ matrix.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ matrix.os }}-py3.11-

      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025, zackees/ci.yml#209). A dedicated cache family: this
      # lane builds a different feature set than preflight. Restore-only: the
      # optional three-OS lane must not grow main's cache budget (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: "false"
          cache-key-suffix: ${{ matrix.label }}-all-features
          prebuild-deps: none
          # maturin runs `cargo` itself. The shims route it through soldr too,
          # so the wheel build shares the zccache-materialized (read-only)
          # artifacts the `soldr cargo` steps leave in target/ instead of
          # failing to overwrite them, and is cached like every other build.
          shims: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Sync venv (frozen, no project install)
        run: uv sync --frozen --group dev --no-install-project --python 3.11

      # #1216: save only on main; PR runs restore main's entry.
      - name: Save venv
        if: ${{ github.ref == 'refs/heads/main' && steps.venv-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      # `ci.test` imports `running_process` at runtime, so the dev wheel has
      # to be installed even though this lane asserts nothing about Python.
      - name: Dev wheel build
        id: build
        run: uv run --no-sync --module ci.run_logged logs/dev-build.log -- uv run --no-sync --module ci.build_wheel --dev

      # `--rust-only`: the Python suite is identical to the one the preflight
      # lane already ran on this OS. `--all-features` is the entire point.
      - name: Unit Tests (--all-features)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync --module ci.run_logged logs/test.log -- uv run --no-sync --module ci.test --all-features --rust-only

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-features-logs-${{ matrix.label }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
