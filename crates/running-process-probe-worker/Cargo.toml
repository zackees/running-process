[package]
name = "running-process-probe-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published: this is an internal sidecar binary shipped alongside the
# daemon, and it is the crate that will own the heavy symbol-file parsers.
publish = false

[lints]
workspace = true

[lib]
name = "running_process_probe_worker"
path = "src/lib.rs"

[[bin]]
name = "running-process-probe-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

# Symbol-file parsers. These live HERE and nowhere else: the crate exists so
# the daemon never links a parser that can be crashed by malformed input.
# PDB parsing is Windows-only; object-file parsing covers PE identity on
# Windows and ELF/DWARF plus Mach-O/dSYM identity and symbols on Unix.
[target.'cfg(target_os = "windows")'.dependencies]
pdb = "0.8"
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
lzma-rs = "0.3"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
