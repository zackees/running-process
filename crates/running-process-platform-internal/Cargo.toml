[package]
name = "running-process-platform-internal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Blessed platform process operations for running-process (implementation detail)"
publish = true

[lints]
workspace = true

[dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt"] }
sysinfo = "0.30"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
winapi = { version = "0.3", features = ["fileapi", "handleapi", "jobapi2", "minwindef", "namedpipeapi", "processenv", "processthreadsapi", "synchapi", "winbase", "winnt"] }
