name: CI Preflight (Windows)

# Thin dispatcher — calls ci-preflight.yml twice, once per Windows arch.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  x86:
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: windows-latest
      label: windows-x86
      rustdoc: false
      integration-test: true

  arm:
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: windows-11-arm
      label: windows-arm
      rustdoc: false
      integration-test: true
      cache-targets: false
      cache-key-suffix: registry
