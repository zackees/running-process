name: Native output shutdown

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/running-process/src/**'
      - 'crates/running-process-platform-internal/**'
      - 'crates/running-process/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'ci/output_shutdown_native.py'
      - 'tests/test_output_shutdown_native.py'
      - 'ci/soldr.py'
      - '.github/workflows/ci-output-shutdown.yml'

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Read the exact PR head and the base's trust policy. Shadow mode reports
  # proof without skipping remote coverage until a real pilot is validated.
  ci-mode:
    name: CI mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      skip_linux-quick: ${{ steps.gate.outputs.skip_linux-quick }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: zackees/ci.yml
          ref: 86b63937960d00655f7ef3752ef6f15b6b06f35b
          path: .ci-lint
          sparse-checkout: ci_lint
          persist-credentials: false
      - name: Local gate attestation
        id: gate
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output

  shutdown:
    needs: [ci-mode]
    name: output-shutdown (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x86 }
          - { os: ubuntu-24.04-arm, label: linux-arm }
          - { os: macos-15-intel, label: macos-x86 }
          - { os: macos-14, label: macos-arm }
          - { os: windows-latest, label: windows-x86 }
          - { os: windows-11-arm, label: windows-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025, zackees/ci.yml#209). Saves are main-only (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: output-shutdown-${{ matrix.label }}
          prebuild-deps: none
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Validate evidence guard
        run: uv run --no-project --module unittest discover -s tests -p test_output_shutdown_native.py
      - name: Native shutdown proof
        run: uv run --no-project --module ci.run_logged logs/output-shutdown.log -- uv run --no-project --module ci.output_shutdown_native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-shutdown-${{ matrix.label }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
