name: Security audit

on:
  pull_request:
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
concurrency:
  group: security-audit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-24.04-security-audit
          cache-on-failure: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny warnings
