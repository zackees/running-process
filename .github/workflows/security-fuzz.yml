name: security-fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/security-fuzz.yml"
      - "crates/running-process/fuzz/**"
      - "crates/running-process/proto/broker_v1/**"
      - "crates/running-process/src/broker/**"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target. Use 3600 for v1 release signoff evidence."
        required: false
        default: "3600"

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
concurrency:
  group: security-fuzz-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_frame_decode
          - fuzz_hello_decode
          - fuzz_helloreply_decode
          - fuzz_cache_manifest_decode
          - fuzz_service_def_decode
          - fuzz_framing_read
          - fuzz_probe_framing_read
          - fuzz_probe_identity_decode
          - fuzz_admin_decode
          - fuzz_handoff_decode
          - fuzz_pipe_name_parse
          - fuzz_service_name_validate
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      # Prebuilt binary, as every other workflow here does. Building cargo-fuzz
      # from source is a release build of a tool we do not ship, repeated
      # across all twelve matrix jobs on every run.
      #
      # install-action has no cargo-fuzz recipe and falls back to
      # cargo-binstall, which delivers the musl build. That matters: cargo-fuzz
      # takes the *fuzz target's* build triple from its own, so a musl-built
      # driver silently builds the targets for musl. The explicit --target on
      # the run step below pins it whatever the driver was built for.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The fuzz crate is its own workspace, so its target directory is not the
      # one the rest of CI caches. Without this each of the twelve jobs rebuilds
      # every dependency of the fuzz targets from scratch -- on a pull request
      # that is minutes of build to buy thirty seconds of fuzzing
      # (FUZZ_SECONDS defaults to 30 there).
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/running-process/fuzz -> target
          key: ubuntu-latest-security-fuzz
          cache-on-failure: true

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: crates/running-process/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'crates/running-process/fuzz/Cargo.toml', 'crates/running-process/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-
            fuzz-corpus-${{ runner.os }}-

      - name: Resolve fuzz duration
        id: fuzz-config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            fuzz_seconds="${FUZZ_SECONDS:-30}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            fuzz_seconds="${{ inputs.fuzz_seconds }}"
            fuzz_seconds="${fuzz_seconds:-3600}"
          else
            fuzz_seconds="${FUZZ_SECONDS:-1800}"
          fi

          case "${fuzz_seconds}" in
            ''|*[!0-9]*)
              echo "::error::fuzz_seconds must be a non-negative integer, got '${fuzz_seconds}'"
              exit 1
              ;;
          esac

          echo "FUZZ_SECONDS=${fuzz_seconds}" >> "${GITHUB_ENV}"
          echo "fuzz_seconds=${fuzz_seconds}" >> "${GITHUB_OUTPUT}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${fuzz_seconds}" -ge 3600 ]]; then
            echo "release_evidence=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_evidence=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run fuzz target
        shell: bash
        run: |
          set -euo pipefail
          cd crates/running-process
          # Pinned to the host triple on purpose. AddressSanitizer cannot be
          # linked against a static libc, so a musl build fails outright with
          # "sanitizer is incompatible with statically linked libc" -- and
          # cargo-fuzz picks its default target from the triple it was itself
          # built for, which depends on how it was installed rather than on
          # anything this workflow states.
          cargo +nightly fuzz run             --target x86_64-unknown-linux-gnu             "${{ matrix.target }}"             -- -max_total_time="${FUZZ_SECONDS}" -timeout=30

      - name: Write release evidence manifest
        if: ${{ success() && steps.fuzz-config.outputs.release_evidence == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="crates/running-process/fuzz/release-evidence/${{ matrix.target }}"
          mkdir -p "${evidence_dir}"
          {
            echo "target=${{ matrix.target }}"
            echo "fuzz_seconds=${{ steps.fuzz-config.outputs.fuzz_seconds }}"
            echo "repository=${{ github.repository }}"
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
          } > "${evidence_dir}/summary.txt"

      - name: Upload release fuzz evidence
        if: ${{ success() && steps.fuzz-config.outputs.release_evidence == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-fuzz-evidence-${{ matrix.target }}
          path: |
            crates/running-process/fuzz/release-evidence/${{ matrix.target }}/summary.txt
            crates/running-process/fuzz/corpus/${{ matrix.target }}
            crates/running-process/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/running-process/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
