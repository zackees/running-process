name: Security audit

on:
  pull_request:
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-audit.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "docs/v1-security-model.md"
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

# Supersede, do not queue. A second push to a pull request makes the first
# run's verdict irrelevant, so cancel it rather than paying for both -- the
# job is short, but it runs no smaller than the queue it was waiting in.
#
# Only for `pull_request`. A push to main keeps its own run to completion,
# because main's per-commit verdict is what release signoff and bisecting
# read; and a scheduled run is never superseded by anything, since it is in
# a different group than any pull request.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-24.04-security-audit
          cache-on-failure: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny warnings
