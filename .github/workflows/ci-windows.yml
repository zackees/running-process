name: CI Preflight (Windows)

# Thin dispatcher — calls ci-preflight.yml twice, once per Windows arch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86:
    # Platform-fix PRs run only their selected native workflow. Keep the
    # workflow itself subscribed so skipped jobs remain visible to GitHub.
    if: ${{ github.event_name != 'pull_request' || !(github.head_ref == 'fix/linux' || startsWith(github.head_ref, 'fix/linux/') || github.head_ref == 'fix/mac' || startsWith(github.head_ref, 'fix/mac/')) }}
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: windows-latest
      label: windows-x86
      rustdoc: false
      integration-test: true

  arm:
    if: ${{ github.event_name != 'pull_request' || !(github.head_ref == 'fix/linux' || startsWith(github.head_ref, 'fix/linux/') || github.head_ref == 'fix/mac' || startsWith(github.head_ref, 'fix/mac/')) }}
    uses: ./.github/workflows/ci-preflight.yml
    with:
      os: windows-11-arm
      label: windows-arm
      rustdoc: false
      integration-test: true
