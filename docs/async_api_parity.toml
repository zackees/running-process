# Sync/async parity manifest -- the machine-readable inventory behind #875.
#
# One `[[row]]` per public member of every tracked surface. `ci.parity_manifest`
# discovers those members straight from the source, so a public method without a
# row here fails lint: the manifest cannot silently fall behind the API.
#
# Columns
#   rust_sync / rust_async / python_sync / python_async
#     Either the name of a test function that exists in this tree, or
#     `n/a: <rationale>` when the column genuinely does not apply.
#
# Status
#   implemented  every applicable column names a real test; the gate verifies it.
#   planned      outstanding work. Must cite `issue`. Reported on every run, and
#                a hard failure once `require_no_planned` is set.
#
# Show the RED state for the remaining rows with:
#   uv run --no-sync python -m ci.parity_manifest --strict
# Regenerate the human-readable table in docs/ASYNC_API_PARITY.md with:
#   uv run --no-sync python -m ci.parity_manifest --write

[settings]
# The end state. Every row is implemented and cites tests that exist, so a
# new `planned` row is now a hard failure rather than a tracked to-do.
require_no_planned = true

