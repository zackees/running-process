[stack.linux]
# Keep the managed stack independent of the shared developer image: this
# branch-specific definition tracks the workspace Rust 1.95.0 toolchain.
dockerfile = "docker/bosn/Dockerfile"
family = "running-process-linux"
default = true
workdir = "/work"

[stack.linux.mounts]
repo = { source = ".", destination = "/work", readonly = true }

[stack.linux.env]
# `uv sync` performs the PEP 517 native build before the managed lint/test
# command starts. Docker Desktop's CPU count is not a safe proxy for the
# memory available to that build, so bound both the build scheduler and the
# compiler/cache wrapper here. Stack environment participates in Bosn's
# generation digest, ensuring changed limits replace a stale container.
CARGO_BUILD_JOBS = "2"
CARGO_TARGET_DIR = "/target"
RUFF_CACHE_DIR = "/uv/cache/ruff"
# PID tracking and CLI/probe diagnostics share writable stack-owned output.
RUNNING_PROCESS_STACK_DUMP_DIR = "/target/running-process-diagnostics"
PYTEST_ADDOPTS = "-o cache_dir=/target/pytest-cache"
SOLDR_JOBS = "2"
UV_CONCURRENT_BUILDS = "1"

[stack.linux.volumes]
target = { scope = "stack", destination = "/target" }
cargo-home = { scope = "machine", destination = "/usr/local/cargo" }
rustup-home = { scope = "machine", destination = "/usr/local/rustup" }
uv-cache = { scope = "machine", destination = "/uv/cache" }
uv-venv = { scope = "stack", destination = "/uv/venv" }

[task.lint]
stack = "linux"
cmd = "bash ./lint"

[task.test]
stack = "linux"
cmd = "bash ./test"
