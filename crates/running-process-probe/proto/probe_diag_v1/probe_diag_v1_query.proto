syntax = "proto3";

package running_process.probe_diag.v1;

import "probe_diag_v1/probe_diag_v1_common.proto";
import "probe_diag_v1/probe_diag_v1_registration.proto";

// The live-process query surface.
//
// Ephemeral and capability-gated: it answers only for currently ARMED
// processes. Durable crash history is a separate surface (crash.proto) with
// different retention and redaction rules.

message ProcessQuery {
  string name_glob = 1;
  string exe_regex = 2;

  // Opt-in, and still filtered by each process's AllowPolicy.env_allowlist.
  // Asking does not override a target's default-deny on env values.
  bool include_env = 3;

  string app_class = 4;

  reserved 5 to 15;
}

message ProcessInfo {
  ProcessKey key = 1;
  string exe_path = 2;
  string app_class = 3;
  string app_name = 4;
  string app_version = 5;
  string instance_name = 6;
  Runtime runtime = 7;
  repeated SupportedOp supported_ops = 8;
  uint64 registered_unix_ms = 9;

  // Only variables the target allowlisted. Never the full environment.
  map<string, string> env = 10;

  reserved 11 to 23;
}

message ProcessQueryReply {
  repeated ProcessInfo processes = 1;
  ProbeErrorCode error = 2;
  string detail = 3;
  reserved 4 to 15;
}
