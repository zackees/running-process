name: CI Preflight Rust-only (Reusable)

# Rust-only variant of ci-preflight.yml for cross-compile targets
# (currently the musl variants of linux). The Python wheel + pytest
# path is skipped because:
#
#   1. The Python interpreter on the runner is glibc-linked. A musl
#      maturin extension would not load.
#   2. The purpose of these matrix entries is to PROVE the workspace
#      compiles + lints + Rust-tests against the musl target. The
#      Python ABI surface is exercised by the native ci-preflight.yml
#      jobs.
#
# Cross-compile path:
#   - apt installs `musl-tools` so `musl-gcc` is on PATH for the
#     C-build-script crates (rusqlite/bundled, blake3 asm, etc.).
#   - `zackees/setup-soldr@v0` provisions the toolchain from
#     rust-toolchain.toml and soldr's zccache-backed build cache
#     (CACHE-025, zackees/ci.yml#209); `soldr rustup target add` adds
#     the rust-std for the musl target.
#   - `soldr cargo build/clippy/nextest --target <triple>` builds
#     against the musl target. The platform-default linker is kept:
#     musl links through musl-gcc, not setup-soldr's fast linker.
#
# Build host vs test host (`build-os`): soldr's catalogue musl compilers
# are x86_64-hosted, and soldr refuses to prepare a musl target on an
# ARM host (soldr#3296). A lane whose tests must execute natively on ARM
# therefore builds on `build-os` (x86_64) and runs its tests on `os` from
# a nextest archive (`unit-test-build` -> `unit-test-run`). Lanes that
# leave `build-os` empty build and test on `os` in one `unit-test` job.

on:
  workflow_call:
    inputs:
      os:
        description: Runner label (e.g. ubuntu-24.04, ubuntu-24.04-arm).
        type: string
        required: true
      label:
        description: Human-readable platform label (e.g. linux-x86-musl) used in job names + artifact suffixes.
        type: string
        required: true
      target:
        description: Rust target triple to cross-compile for (e.g. x86_64-unknown-linux-musl).
        type: string
        required: true
      features:
        description: running-process feature set exercised by build, lint, and Rust unit/integration tests.
        type: string
        default: client
      build-os:
        description: Runner that compiles, when it differs from the test runner `os` (see header). Empty builds on `os`.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: "always"

jobs:
  warm:
    name: warm-build (${{ inputs.label }})
    runs-on: ${{ inputs.build-os || inputs.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        run: bash ci/install_musl_tools.sh

      # Toolchain from rust-toolchain.toml plus soldr's zccache-backed build
      # cache (CACHE-025, zackees/ci.yml#209). Saves are main-only (#1216).
      # warm-build owns the save; lint and unit-test restore only.
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          cache-key-suffix: ${{ inputs.label }}-preflight-rust
          prebuild-deps: none
          linker: platform-default

      - name: Install ${{ inputs.target }} standard library
        run: soldr rustup target add ${{ inputs.target }} --toolchain 1.95.0

      - name: cargo build --target ${{ inputs.target }}
        run: soldr cargo build --workspace --exclude running-process-py --all-targets --features ${{ inputs.features }} --target ${{ inputs.target }}

  lint:
    name: lint (${{ inputs.label }})
    needs: warm
    runs-on: ${{ inputs.build-os || inputs.os }}
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: bash ci/install_musl_tools.sh
      # Restore-only: warm-build owns the save (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: "false"
          cache-key-suffix: ${{ inputs.label }}-preflight-rust
          prebuild-deps: none
          linker: platform-default
      - name: Install ${{ inputs.target }} standard library
        run: soldr rustup target add ${{ inputs.target }} --toolchain 1.95.0
      - name: cargo clippy --target ${{ inputs.target }}
        run: soldr cargo clippy --workspace --exclude running-process-py --all-targets --features ${{ inputs.features }} --target ${{ inputs.target }} -- -D warnings

  unit-test:
    name: unit-test (${{ inputs.label }})
    needs: warm
    if: ${{ inputs.build-os == '' || inputs.build-os == inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: bash ci/install_musl_tools.sh
      # Restore-only: warm-build owns the save (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: "false"
          cache-key-suffix: ${{ inputs.label }}-preflight-rust
          prebuild-deps: none
          linker: platform-default
      - name: Install ${{ inputs.target }} standard library
        run: soldr rustup target add ${{ inputs.target }} --toolchain 1.95.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # musl binaries are statically linked and run on the host-arch
      # glibc runner without QEMU. If a downstream lane introduces a
      # non-host musl triple (e.g. aarch64-musl on x86 runner), this
      # step needs `qemu-user-static` and `cross` instead — flag in
      # PR review.
      # Fixtures are built once, up front; the tests look them up rather
      # than each invoking `cargo build` themselves (running-process#747).
      # This lane calls nextest directly instead of going through
      # `ci.test`, so it needs its own build — with the same `--target`,
      # or the binaries land in the host tree and the tests miss them.
      - name: Build test fixtures
        run: soldr cargo build -p testbins --target ${{ inputs.target }}
      # NOT built here: `testbins-tokio`, the console-subscriber fixture
      # (#788). It needs `--cfg tokio_unstable`, which forces a full tokio
      # rebuild, and it would have to be cross-compiled for this lane's
      # target. The tokio console-api tests skip with an explanatory message
      # when the fixture is absent, so this lane loses that one test's
      # coverage rather than failing. The six `ci-preflight.yml` lanes go
      # through `ci.test`, which does build it — so the subscription is
      # exercised on every host platform, just not on the musl cross targets.
      - name: Rust unit and integration tests (${{ inputs.features }})
        run: soldr cargo nextest run --workspace --exclude running-process-py --features ${{ inputs.features }} --target ${{ inputs.target }}

  # Cross-built lane, step 1: compile the tests and fixtures on `build-os`
  # into a nextest archive. The `aarch64-musl-archive` profile in
  # .config/nextest.toml adds the testbins fixtures, which the tests look up
  # beside their own `deps/` directory.
  unit-test-build:
    name: unit-test-build (${{ inputs.label }})
    needs: warm
    if: ${{ inputs.build-os != '' && inputs.build-os != inputs.os }}
    runs-on: ${{ inputs.build-os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: bash ci/install_musl_tools.sh
      # Restore-only: warm-build owns the save (#1216).
      - name: Set up soldr (toolchain + build cache)
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          save-cache: "false"
          cache-key-suffix: ${{ inputs.label }}-preflight-rust
          prebuild-deps: none
          linker: platform-default
      - name: Install ${{ inputs.target }} standard library
        run: soldr rustup target add ${{ inputs.target }} --toolchain 1.95.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build test fixtures
        run: soldr cargo build -p testbins --target ${{ inputs.target }}
      - name: Archive Rust unit and integration tests (${{ inputs.features }})
        run: soldr cargo nextest archive --workspace --exclude running-process-py --features ${{ inputs.features }} --target ${{ inputs.target }} --profile aarch64-musl-archive --archive-file "${{ runner.temp }}/nextest-${{ inputs.label }}.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-${{ inputs.label }}
          path: ${{ runner.temp }}/nextest-${{ inputs.label }}.tar.zst
          if-no-files-found: error
          retention-days: 3

  # Cross-built lane, step 2: run the archived tests natively on `os`.
  # Nothing compiles here, so the job needs neither soldr nor cargo.
  unit-test-run:
    name: unit-test (${{ inputs.label }})
    needs: unit-test-build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "full"
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive-${{ inputs.label }}
          path: ${{ runner.temp }}/nextest-archive
      - name: Rust unit and integration tests (${{ inputs.features }})
        run: cargo-nextest nextest run --archive-file "${{ runner.temp }}/nextest-archive/nextest-${{ inputs.label }}.tar.zst" --workspace-remap "${{ github.workspace }}" --profile aarch64-musl-archive
