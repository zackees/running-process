name: Cache budget (main)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-cache-budget:
    name: Retire disabled all-features caches and check repository budget
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Retire the disabled families and enforce the live budget
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/cache_budget.py
