// running-process v2 broker — Phase 3 session data-plane messages (soldr#2365).
//
// Pairs with the other `running_process.broker.v2` protos. After a client
// negotiates a compile session on the control plane, the session's stdio is
// proxied client <-> broker <-> daemon as a stream of `SessionFrame`s on the
// SESSION payload-protocol lane (see `broker::protocol::registry`). The client
// is a dumb terminal: it feeds stdin frames and renders stdout/stderr frames,
// then reads the terminal `SessionExit`. All byte payloads are opaque and
// byte-transparent — rustc emits raw artifacts on stdout and JSON diagnostics
// on stderr; neither stream may be mutated or reordered.
//
// This file adds only the message definitions + prost wiring; the broker proxy
// pump, the daemon session backend, and the dumb-terminal client land in later
// slices of Phase 3 (see soldr#2365).

syntax = "proto3";
package running_process.broker.v2;

// Selects the base environment for the session child. AUTO is deliberately
// not a wire value: the client resolves lifetime-dependent defaults before
// opening the session.
enum EnvironmentPolicy {
  ENVIRONMENT_POLICY_UNSPECIFIED   = 0;
  ENVIRONMENT_POLICY_INHERIT       = 1;
  ENVIRONMENT_POLICY_USER_BASELINE = 2;
  ENVIRONMENT_POLICY_CLEAR         = 3;
}

// One frame on a proxied compile session's stdio stream. Exactly one field is
// set per frame (proto3 oneof). Directionality is by field, not a flag:
// `stdin` / `stdin_eof` flow client -> daemon; `stdout` / `stderr` / `exit`
// flow daemon -> client. Frames are delivered in order within each direction.
message SessionFrame {
  oneof kind {
    // Raw stdin bytes from the client's terminal toward the daemon's compiler.
    bytes stdin = 1;
    // The client closed stdin; no further `stdin` frames follow. Distinct from
    // an empty `stdin` chunk so the daemon can close the child's stdin pipe.
    bool stdin_eof = 2;
    // Raw stdout bytes from the compile (artifacts), verbatim.
    bytes stdout = 3;
    // Raw stderr bytes from the compile (diagnostics), verbatim.
    bytes stderr = 4;
    // Terminal frame: the compile ended. No further frames follow for this
    // session in either direction.
    SessionExit exit = 5;
    // The mandatory FIRST frame client -> daemon: names the command to run for
    // this session (added in a later Phase-3 slice; a session must open with
    // exactly one `start` before any `stdin`). The daemon builds the compiler
    // process from it, then proxies stdio as above.
    SessionStart start = 6;
  }
}

// The command a compile session runs, carried on the session's opening `start`
// frame. `environment_policy` selects the base; `env` is then applied in
// order (repeated, not a map) so key-case collisions resolve deterministically
// the way `std::process::Command::env` does.
message SessionStart {
  string program = 1;
  repeated string args = 2;
  string cwd = 3;
  repeated SessionEnvVar env = 4;
  // Deprecated compatibility field. New clients dual-write it for old servers.
  bool clear_inherited_env = 5;
  EnvironmentPolicy environment_policy = 6;
}

// One ordered environment entry for `SessionStart.env`. (The `broker.v2`
// package cannot reach `daemon.proto`'s `KeyValue`, so it defines its own.)
message SessionEnvVar {
  string key = 1;
  string value = 2;
}

// How a proxied compile session ended. `code` is the child's exit code when it
// exited normally. `signal` is the terminating Unix signal number when the
// child was killed by a signal (0 when it exited normally, and always 0 on
// Windows). Consumers read `signal` first: a non-zero `signal` means signal
// death regardless of `code`.
message SessionExit {
  int32 code = 1;
  int32 signal = 2;
  // Opaque service-defined key/value metadata carried on the terminal frame
  // (soldr#2365 Q3). running-process never interprets it — `relay_session`
  // does not even decode the frame, so the broker relays it transparently. A
  // consumer daemon populates keys its own clients understand: soldr carries
  // `cache_outcome` / `compile_id` here so the SESSION path preserves the
  // observability the legacy `CompileDone` frame carried (build history,
  // `soldr doctor`, perf-gate attribution). Backward-compatible proto3
  // addition; existing peers that do not set it send an empty map.
  map<string, string> metadata = 3;
}
